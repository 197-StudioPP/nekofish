<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แมวตกปลา</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: cosy and playful, with a little danger out at sea
IDEA: a fisherman's tackle box with a collector's card binder
PICTURE: the live sea scene itself: boat, cat captain, line, bobber, monsters
COLOUR and TYPE: sea teal and sand, one amber accent; Mitr headings, Sarabun body
LAYOUT: scene on top, big thumb buttons under it, port and card binder below */
:root{color-scheme:light dark;--bg:light-dark(#f5ecdc,#0e1b22);--ink:light-dark(#1d2a30,#efe6d6);--mut:light-dark(#6b6457,#a59c8c);--card:light-dark(#fffaf0,#16262e);--line:light-dark(#e2d5bd,#2a3a42);--sea:#0f4c5c;--amb:#e8912e;--amb2:#b8640f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Sarabun,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,button{font-family:Mitr,Sarabun,sans-serif;font-weight:500}
.wrap{max-width:760px;margin:0 auto;padding:12px max(3vw,12px) 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;margin:4px 2px 10px}
h1{font-size:32px;line-height:1.05;margin:0}
.stats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:15px;color:var(--mut)}
.stats b{color:var(--ink);font-family:Mitr;font-weight:500;white-space:nowrap}
.fig{position:fixed;inset:0;overflow:hidden;background:var(--sea);touch-action:none;user-select:none;-webkit-user-select:none}
.fig canvas{position:absolute;inset:0;width:100%;height:100%}
#toast{position:absolute;left:50%;top:92px;font-family:Mitr,Sarabun,sans-serif;transform:translateX(-50%);background:rgba(8,18,24,.85);color:#fff;padding:10px 18px;border-radius:14px;font-size:17px;width:max-content;max-width:90%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
.status{display:flex;gap:4px 14px;flex-wrap:wrap;margin:10px 2px;font-size:15px;color:var(--mut);min-height:24px}
.status b{color:var(--ink);font-weight:600;white-space:nowrap}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
button{min-height:48px;border:0;border-radius:14px;font-size:17px;cursor:pointer;color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:6px 12px}
button.main{background:var(--amb);color:#2a1606;box-shadow:0 3px 0 var(--amb2);font-size:20px;min-height:64px}
button.main:active{transform:translateY(2px);box-shadow:0 1px 0 var(--amb2)}
button.alt{background:#5fb3c9;box-shadow:0 3px 0 #2f7f94}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.big{grid-column:1/-1}
section{margin-top:24px}
h2{font-size:22px;line-height:1.2;margin:0 0 10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.box{background:var(--card);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column}
.box h3{margin:0;font-size:18px}.box p{margin:4px 0 12px;color:var(--mut);font-size:15px;flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.card{border-radius:14px;padding:12px 8px 10px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;position:relative;text-align:center}
.card.r1{box-shadow:inset 0 0 0 2px #3d95d4}
.card.r2{box-shadow:inset 0 0 0 3px #a55ad0;background:light-dark(#f7efff,#231b30)}
.card.r3{background:conic-gradient(from 30deg,#fff4d6,#b9c6d8,#f2dfbd,#8c8c9c,#d9a070,#fff4d6);box-shadow:inset 0 0 0 3px #d9a514;color:#1d2a30}
.card.crew::after{content:"ลูกเรือ";position:absolute;top:8px;left:8px;background:var(--amb);color:#2a1606;font:500 13px Mitr;padding:1px 8px;border-radius:8px}
.card.cap::after{content:"กัปตัน"}
.card.ret{filter:grayscale(1);opacity:.55;cursor:default}
.card svg{width:84px;height:84px;display:block;margin:0 auto}
.card .nm{font:500 17px/1.3 Mitr;margin-top:2px}
.card .tb{font-size:13px;opacity:.85}
.rar{font-size:13px;font-weight:600}
.paws{display:flex;justify-content:center;gap:3px;margin-top:6px}
.paws i{width:9px;height:9px;border-radius:50%;background:var(--amb)}
.paws i.x{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mut)}
.hint{color:var(--mut);font-size:14px;margin:8px 2px}
.perks{display:grid;gap:6px;font-size:15px}
.perks b{font-family:Mitr;font-weight:500}
#modal{position:fixed;inset:0;background:rgba(6,12,16,.8);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#modal.on{display:flex}
.mbox{background:var(--bg);border-radius:20px;padding:18px;max-width:520px;max-height:86vh;overflow:auto;width:100%;text-align:center;display:grid;gap:10px}
.mbox h2{margin:0}
#amber{width:210px;height:210px;margin:0 auto;cursor:pointer;touch-action:manipulation}
.knock{animation:knock .18s}
@keyframes knock{50%{transform:scale(.93) rotate(3deg)}}
.pop{animation:pop .55s ease-out}
@keyframes pop{0%{transform:scale(.3) rotate(-10deg);opacity:0}100%{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.pop,.knock{animation:none}}
.hidden{display:none!important}
.foot{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.foot button{font-size:14px;min-height:44px}
</style></head><body>
<div class="fig" id="fig"><canvas id="cv"></canvas><div id="toast"></div></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<script>
{
const $=s=>document.querySelector(s);
const ri=n=>Math.floor(Math.random()*n),pick=a=>a[ri(a.length)],cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const TR=[
{n:'ขาวมณี',sk:'จักสิรา',c:'#f3efe6',e:'#3a86d9',perk:'เห็นว่าอะไรติดเบ็ดก่อนดึง'},
{n:'สีสวาด',sk:'ฮาดริน',c:'#8d9db3',e:'#6fbf3c',perk:'เสบียงเพิ่ม 3 ทุกรอบที่ออกเรือ'},
{n:'วิเชียรมาศ',sk:'กันทะรา',c:'#ecdcbf',p:'#4a3426',e:'#3f9fe0',perk:'ใช้คลื่นเสียงเรียกปลา ปลากินเบ็ดเร็วขึ้นเท่าตัว'},
{n:'โกญจา',sk:'คัสสปา',c:'#2a2a33',e:'#e8c547',perk:'เจออำพันแมวบ่อยขึ้น'},
{n:'ศุภลักษณ์',sk:'พีโลมัน',c:'#7b4a2b',e:'#e8b547',perk:'แรงดึงดี แถบดึงกว้างขึ้น'}];
const ROM=['','I','II','III','IV','V'],RAR=['ธรรมดา','หายาก','สองสายเลือด','ขนทองห้าสี'],RC=['var(--mut)','#2f86c9','#9a4fc7','#7a5a00'];
const ZN=['อ่าวตื้น','ทะเลคราม','ร่องลึก','ทะเลพายุ','ทะเลไร้ชื่อ'];
const zname=z=>z<=4?ZN[z-1]:ZN[4]+' '+(z-4);
const FISH=[['ปลาทูน้อย',4],['ปลาเก๋า',7],['ปลากะพง',10],['หมึกยักษ์',16],['กระเบนเงา',24],['ปลาไหลแสง',34],['ปลาจันทร์',50],['วาฬจิ๋ว',75]];
const NM1=['สร้อย','ทอง','นิล','มุก','ครีม','ส้ม','เมฆ','ขนุน','ถั่ว','ข้าวตู','บัว','ลำไย','ดาว','จันทร์','หมอก','ขิง','โมจิ','ชาไทย'];
const NM2=['','','น้อย','ทะเล','ใหญ่','ฟ้า','แก้ว','คราม','ไหม'];
let S=null;
try{S=JSON.parse(localStorage.getItem('nekofish1'))}catch(e){}
if(!S||!Array.isArray(S.cards))S={coins:0,rod:1,boat:1,amber:1,cards:[],crew:[],best:1,t:Date.now()};
const save=()=>{S.t=Date.now();try{localStorage.setItem('nekofish1',JSON.stringify(S))}catch(e){}};
const crewCards=()=>S.crew.map(id=>S.cards.find(c=>c.id===id)).filter(c=>c&&!c.ret);
const has=k=>crewCards().some(c=>c.a===k||c.b===k);
const lead=()=>crewCards()[0];
let awayMsg='';
{const m=(Date.now()-S.t)/60000,n=crewCards().length;
if(m>1&&n){const g=Math.floor(Math.min(m,480)*n*(0.5+S.best*0.3));if(g>0){S.coins+=g;awayMsg='ระหว่างที่ไม่อยู่ ลูกเรือตกปลาได้ +'+g+' เหรียญ'}}}

function newCard(){
const r=Math.random();let a=ri(5),b=-1,rar,lv;
if(r<0.0005){rar=3;lv=5;b=(a+1+ri(4))%5}
else if(r<0.13){rar=2;lv=3;b=(a+1+ri(4))%5}
else if(r<0.38){rar=1;lv=2+ri(2)}
else{rar=0;lv=1}
return{id:Date.now().toString(36)+ri(1e6).toString(36),n:pick(NM1)+pick(NM2),a,b,rar,lv,lives:9,dives:0,best:0,ret:0}}

function catSVG(c){
const A=TR[c.a],B=c.b>=0?TR[c.b]:null,c1=A.c,c2=B?B.c:c1,pt=A.p||(B&&B.p);
return`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M20 40 L17 9 L40 28Z" fill="${c1}" stroke="#0003"/><path d="M80 40 L83 9 L60 28Z" fill="${c2}" stroke="#0003"/><ellipse cx="50" cy="54" rx="34" ry="30" fill="${c1}" stroke="#0003"/>${B?`<path d="M50 24 A34 30 0 0 1 50 84Z" fill="${c2}"/>`:''}${pt?`<ellipse cx="50" cy="64" rx="15" ry="12" fill="${pt}" opacity=".8"/>`:''}<ellipse cx="37" cy="51" rx="6.5" ry="7.5" fill="${A.e}"/><ellipse cx="63" cy="51" rx="6.5" ry="7.5" fill="${B?B.e:A.e}"/><ellipse cx="37" cy="52" rx="2" ry="5.5" fill="#111"/><ellipse cx="63" cy="52" rx="2" ry="5.5" fill="#111"/><path d="M46.5 61 L53.5 61 L50 65Z" fill="#e58a9a"/><path d="M50 65 Q45 70 41 67 M50 65 Q55 70 59 67" stroke="#0008" fill="none" stroke-width="1.5"/></svg>`}

const cardHTML=c=>{const i=S.crew.indexOf(c.id);
return`<div class="card r${c.rar}${i>=0&&!c.ret?' crew':''}${i===0&&!c.ret?' cap':''}${c.ret?' ret':''}" data-id="${c.id}">${catSVG(c)}<div class="nm">${c.n}</div><div class="rar" style="color:${RC[c.rar]}">${c.ret?'อนุสรณ์':RAR[c.rar]}</div><div class="tb">${TR[c.a].n}${c.b>=0?' + '+TR[c.b].n:''} · ระดับ ${ROM[c.lv]}</div><div class="paws">${Array.from({length:9},(_,k)=>`<i class="${k<c.lives?'':'x'}"></i>`).join('')}</div></div>`};
const perkText=c=>'ช่วยบนเรือ: '+TR[c.a].perk+(c.b>=0?' และ'+TR[c.b].perk:'');

const modal=$('#modal'),mbox=$('#mbox');
let mode='port',T=null,R=null,F=null,item=null,waitT=0,biteT=0,holding=false,shake=0,cast=0,t=0,toastT;
function toast(m,ms=1800){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),ms)}

let sheet=null;
function setMode(m){mode=m;if(m==='port'&&sheet)renderSheet()}
const rodCost=()=>40*S.rod*S.rod,boatCost=()=>70*S.boat*S.boat;
const perksHTML=()=>TR.map(x=>`<div><b>${x.n}</b> (${x.sk}): ${x.perk}</div>`).join('')+'<div>แมวสองสายเลือดได้ความสามารถของทั้งสองเผ่า</div>';
function renderSheet(){
if(sheet==='cards'){const list=[...S.cards].sort((a,b)=>(a.ret-b.ret)||(b.rar-a.rar)||(b.lv-a.lv));
mbox.innerHTML=`<h2>แมวของคุณ</h2><p class="hint">แตะการ์ดเพื่อพาขึ้นเรือ ได้สูงสุด ${S.boat} ตัว ตัวแรกเป็นกัปตันที่ลงสู้ (${crewCards().length}/${S.boat})</p><div class="cards">${list.length?list.map(cardHTML).join(''):'<p class="hint">ยังไม่มีแมว ทุบอำพันก่อน</p>'}</div><div class="perks" style="text-align:left">${perksHTML()}</div><div class="foot"><button id="reset">ล้างเซฟ</button><button id="mClose" class="main" style="min-height:48px;font-size:17px">ปิด</button></div>`}
else if(sheet==='rod'||sheet==='boat'){const k=sheet,lv=S[k],cost=k==='rod'?rodCost():boatCost(),max=k==='rod'?10:6;
mbox.innerHTML=`<h2>${k==='rod'?'เบ็ด':'เรือ'} ระดับ ${lv}</h2><p class="hint">${k==='rod'?'แถบดึงกว้างขึ้น ปลาหลุดยากขึ้น':'เสบียง +4 และที่นั่งลูกเรือ +1'}</p><p class="hint">มี ${S.coins} เหรียญ</p><button class="main" id="mUp" ${lv>=max||S.coins<cost?'disabled':''}>${lv>=max?'ระดับสูงสุด':'อัปเกรด '+cost+' เหรียญ'}</button><button id="mClose">ปิด</button>`}}
function openSheet(k){sheet=k;renderSheet();modal.classList.add('on')}
function closeSheet(){sheet=null;modal.classList.remove('on')}
function sail(){if(!crewCards().length){toast('ยังไม่มีแมวบนเรือ ทุบอำพันก่อน');return}
T={zone:1,food:6+S.boat*4+(has(1)?3:0),hold:0,amb:0};setMode('idle');toast('แตะน้ำเพื่อเหวี่ยงเบ็ด')}
function doCast(){
if(T.food<=0){strand();return}
T.food--;cast=0;const r=Math.random();
if(r<0.06){T.food=Math.max(0,T.food-2);shake=.3;toast('พายุพัดมา! เสบียง −2')}
else if(r<0.11){T.food+=2;toast('เจอลังลอยน้ำ เสบียง +2')}
else if(r<0.14&&T.hold>0){const l=Math.ceil(T.hold*.15);T.hold-=l;toast('นกนางนวลขโมยปลาไป −'+l+' เหรียญ')}
waitT=(1.4+Math.random()*3)*(has(2)?.5:1);setMode('wait')}
function far(){if(T.food<3){toast('เสบียงไม่พอแล่นต่อ');return}
T.food-=2;T.zone++;S.best=Math.max(S.best,T.zone);save();toast('มาถึง'+zname(T.zone))}
function strand(){T.hold=Math.floor(T.hold/2);goHome('เสบียงหมด! ลอยกลับฝั่ง ของเสียไปครึ่งหนึ่ง')}
function goHome(msg){const L=lead();if(L){L.dives++;L.best=Math.max(L.best,T.zone)}
S.coins+=T.hold;S.amber+=T.amb;
toast(msg||('ขายของได้ '+T.hold+' เหรียญ'+(T.amb?' และได้อำพัน '+T.amb+' ก้อน':'')),2600);
T=null;save();setMode('port')}
function hook(){
if(mode==='wait'){if(cast>=1)toast('ยังก่อน รอให้ทุ่นจม',900);return}
if(mode!=='bite')return;
if(item.t==='mon'){F={hp:item.hp,max:item.hp,ph:3,st:'idle',t:1.1,wt:0,crit:false,cd:0,flash:0};setMode('fight');toast(item.n+'โผล่ขึ้นมา!')}
else{const d=Math.min(.9,item.d)*((S.reels||0)<3?.5:1),bpm=84+Math.round(d*60),tm=14+d*10;
R={d,bpm,bi:60/bpm,clock:-.6,beats:[{i:0,tm:0,x:0,c:false,done:true}],lx:0,lz:10,ang:0,hp:4+Math.round(d*6),max:0,hearts:3,time:tm,tm,combo:0,fx:0,ok:0,paw:0,px:0,pz:10,pops:[],jumpT:0,judge:'',jt:0,win:cl(.2-d*.06+S.rod*.008+(has(4)?.03:0),.11,.26)};R.max=R.hp;R.jump=0;setMode('reel')}}
function roll(){const z=T.zone;
const w=[['fish',58],['junk',12],['chest',5+z*2],['amber',(3+z*1.4)*(has(3)?1.6:1)],['mon',5+z*3]];
let s=w.reduce((a,b)=>a+b[1],0)*Math.random(),k='fish';for(const[n,v]of w){if((s-=v)<0){k=n;break}}
if(k==='fish'){const i=Math.min(FISH.length-1,ri(2+z)),f=FISH[i];return{t:k,n:f[0],v:Math.round(f[1]*(1+.25*(z-1))*(.8+Math.random()*.4)),d:.25+i*.07+z*.04}}
if(k==='junk')return{t:k,n:pick(['รองเท้าเก่า','ขวดแก้ว','สาหร่ายพันกัน','กระป๋องบุบ']),v:1,d:.15};
if(k==='chest')return{t:k,n:'หีบสมบัติ',v:20+z*15+ri(20),d:.45+z*.05};
if(k==='amber')return{t:k,n:'อำพันแมว',v:0,d:.55+z*.05};
return{t:'mon',n:pick(['ปูหนามเหล็ก','ปลาไหลเงา','หมึกคลั่ง','งูทะเลเสียงหวีด']),v:30+z*20,d:0,hp:3+z*2}}
const fishX=tm=>3.2*Math.sin(2*Math.PI*tm/(8*R.bi));
function pushBeat(){const p=R.beats[R.beats.length-1],i=p.i+1,tm=i*R.bi;
const rest=i<2||Math.random()<.3-R.d*.15,q=Math.random(),type=q<.07?'heart':q<.13?'time':q<.22?'coin':'n';
R.beats.push({i,tm,x:fishX(tm),c:!rest,type,done:rest})}
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function upReel(dt){R.fx-=dt;R.paw-=dt;R.jump-=dt;R.jt-=dt;R.time-=dt;R.clock+=dt;
if(R.time<=0){toast(item.n+'ดิ้นหลุด หมดเวลา',1800);setMode('idle');return}
while(R.beats[R.beats.length-1].tm<R.clock+4*R.bi)pushBeat();
const nx=fishX(Math.max(0,R.clock));R.ang=nx>=R.lx?0:Math.PI;R.lx=nx;
for(const bt of R.beats)if(bt.c&&!bt.done&&R.clock>bt.tm+R.win){bt.done=true;R.combo=0;R.judge='หลุดจังหวะ';R.jt=.5}
R.beats=R.beats.filter((bt,i,arr)=>bt.tm>R.clock-2*R.bi||i===arr.length-1);R.pops=R.pops.filter(p=>(p.t-=dt)>0)}
const onC=()=>R.beats.find(bt=>bt.c&&!bt.done&&Math.abs(R.clock-bt.tm)<R.win);
function strike(){if(mode!=='reel'||R.fx>.1)return;const c=onC();
if(c){c.done=true;const df=Math.abs(R.clock-c.tm),perfect=df<.07;R.pops.push({x:c.x,z:10,t:.45});
const dmg=(perfect?1.5:1)*(1+Math.min(R.combo,8)*.15);R.combo++;R.hp-=dmg;R.ok=1;R.fx=.25;R.paw=.3;R.px=c.x;R.pz=10;R.jump=.6;R.judge=perfect?'เป๊ะ!':'ดี';R.jt=.5;
if(c.type==='heart'){R.hearts=Math.min(3,R.hearts+1);toast('สายเบ็ดฟื้น +1',700)}
else if(c.type==='time'){R.time+=4;R.tm=Math.max(R.tm,R.time);toast('เวลา +4 วินาที',700)}
else if(c.type==='coin'){const g=5+T.zone*4;T.hold+=g;toast('เหรียญ +'+g,700)}
if(R.hp<=0){S.reels=(S.reels||0)+1;if(item.t==='amber'){T.amb++;toast('ได้อำพันแมว! เอากลับฝั่งไปทุบ',2200)}else{T.hold+=item.v;toast('ได้'+item.n+' +'+item.v,1600)}setMode('idle')}}
else{R.combo=0;R.hearts--;R.ok=0;R.fx=.25;shake=.2;R.judge='ผิดจังหวะ';R.jt=.5;

cx.fillStyle='#e04a3a';cx.beginPath();cx.moveTo(bxo-12,byo+4);cx.lineTo(bxo,byo-14);cx.lineTo(bxo+3,byo+4);cx.fill();cx.fillStyle='#9a2a20';cx.beginPath();cx.moveTo(bxo+3,byo+4);cx.lineTo(bxo,byo-14);cx.lineTo(bxo+12,byo+4);cx.fill();cx.fillStyle='#00000030';cx.beginPath();cx.ellipse(bxo+3,byo+6,16,3,0,0,7);cx.fill();
hitR(bxo-30,byo-56,64,76,'far');lbl('ไปต่อ (เสบียง −2)',bxo,byo+28);
cx.font='500 15px Mitr,sans-serif';cx.textAlign='center';cx.fillStyle='#ffffffd0';cx.fillText('~ '+zname(T.zone)+' ~',W/2,hz-16)}
function drawCargo(bx,by){const L=lead();
cx.fillStyle='#4a2f1b';cx.fillRect(bx-46,by-100,4,96);
cx.fillStyle='#f4efe6';cx.beginPath();cx.moveTo(bx-42,by-100);cx.quadraticCurveTo(bx-18,by-96+Math.sin(t*4)*3,bx+6,by-100);cx.lineTo(bx+6,by-72);cx.quadraticCurveTo(bx-18,by-68+Math.sin(t*4+1)*3,bx-42,by-72);cx.fill();
const lv=L?L.lives:0;for(let i=0;i<9;i++){const px=bx-34+(i%3)*12,py=by-93+Math.floor(i/3)*8;cx.beginPath();cx.arc(px,py,3,0,7);if(i<lv){cx.fillStyle='#e8912e';cx.fill()}else{cx.strokeStyle='#9a8f80';cx.lineWidth=1;cx.stroke()}}
for(let i=0;i<Math.min(T.food,6);i++)cube(bx-66+(i%3)*11,by-12-Math.floor(i/3)*10,9,8,4,i%2?'#7a5230':'#8a5a34');
const nf=Math.min(8,Math.ceil(T.hold/12));for(let i=0;i<nf;i++){cx.fillStyle='#cfe0e8';cx.beginPath();cx.ellipse(bx+34+(i%4)*8,by-6-Math.floor(i/4)*5,6,3,(i%2?.3:-.3),0,7);cx.fill()}
for(let i=0;i<Math.min(T.amb,4);i++){cx.fillStyle='#e8912e';cx.beginPath();cx.arc(bx+22+i*7,by-12,3.5,0,7);cx.fill()}
lbl('เสบียง '+T.food+' · ของ '+T.hold+' เหรียญ'+(T.amb?' · อำพัน '+T.amb:''),bx,by+52)}
function tip(m,y){banner(m)}
let SP=[];
function spot(x,y,a,lab,hot){SP.push({x,y,r:hot?26:22,a});const p=1+Math.sin(t*4)*(hot?.2:.08);
cx.fillStyle=hot?'#e8912e55':'#ffffff3a';cx.beginPath();cx.arc(x,y,20*p,0,7);cx.fill();
cx.strokeStyle='#ffffffcc';cx.lineWidth=2;cx.beginPath();cx.arc(x,y,20*p,0,7);cx.stroke();
cx.fillStyle=hot?'#e8912e':'#fff';cx.beginPath();cx.arc(x,y,7,0,7);cx.fill();
if(lab){cx.font='500 13px Mitr,sans-serif';cx.textAlign='center';const w=cx.measureText(lab).width+16,lx=cl(x,w/2+4,W-w/2-4);cx.fillStyle='#08121ab3';rr(lx-w/2,y+26,w,22,11);cx.fillStyle='#fff';cx.fillText(lab,lx,y+42)}}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);
if(mode==='wait'){cast=Math.min(1,cast+dt*2.5);waitT-=dt;if(waitT<=0){item=roll();biteT=1.5;setMode('bite')}}
else if(mode==='bite'){biteT-=dt;if(biteT<=0){toast('ช้าไป ปลาหลุดเบ็ด');setMode('idle')}}
else if(mode==='reel')upReel(dt);else if(mode==='fight')upFight(dt);
if(W)draw();requestAnimationFrame(loop)}

addEventListener('pointerup',()=>{holding=false});addEventListener('pointercancel',()=>{holding=false});
fig.addEventListener('pointerdown',e=>{e.preventDefault();const b=fig.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
if(mode==='reel'){strike();return}if(mode==='wait'||mode==='bite'){hook();return}
let best=null;for(const p of SP)if(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h){best=p;break}
if(best)act(best.a);else if(mode==='fight')hit();else if(mode==='idle'&&y>H*.42)doCast()});
addEventListener('keydown',e=>{if(e.repeat||$('#modal').classList.contains('on'))return;
if(e.code==='Space'){e.preventDefault();({port:sail,idle:doCast,wait:hook,bite:hook,reel:strike,fight:dodge})[mode]?.()}
else if(e.key==='j'&&mode==='fight')hit()});
addEventListener('keyup',e=>{if(e.code==='Space')holding=false});

let hits=0,resetArm=false;
const CR=['M100 34 L90 72 L108 96','M54 92 L86 104 L76 136','M150 76 L120 108 L134 146','M66 150 L98 124 L122 164','M100 100 L58 118 M100 100 L154 116'];
function crackView(){mbox.innerHTML=`<h2>ทุบอำพัน</h2><p class="hint">แตะอีก ${5-hits} ครั้ง</p><svg id="amber" viewBox="0 0 200 200" role="button" aria-label="แตะเพื่อทุบ"><defs><radialGradient id="ag" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd27a"/><stop offset=".6" stop-color="#e8912e"/><stop offset="1" stop-color="#9a4c0c"/></radialGradient></defs><path d="M100 18 C150 22 182 70 176 118 C170 160 136 186 98 184 C56 182 22 152 24 108 C26 62 56 16 100 18Z" fill="url(#ag)"/><g opacity="${.15+hits*.12}" fill="#3a1a04"><ellipse cx="100" cy="122" rx="40" ry="28"/><circle cx="100" cy="86" r="24"/><path d="M80 76 L78 50 L94 66Z M120 76 L122 50 L106 66Z"/></g><ellipse cx="72" cy="56" rx="22" ry="12" fill="#fff" opacity=".35" transform="rotate(-30 72 56)"/>${CR.slice(0,hits).map(d=>`<path d="${d}" stroke="#fff3d6" stroke-width="3" fill="none" stroke-linecap="round"/>`).join('')}</svg>`}
function openCrack(){if(!S.amber){toast('ยังไม่มีอำพัน ออกเรือไปหามาก่อน');return}sheet='amber';hits=0;crackView();modal.classList.add('on')}
function reveal(){sheet='reveal';S.amber--;const c=newCard();S.cards.push(c);if(crewCards().length<S.boat)S.crew.push(c.id);save();
mbox.innerHTML=`<h2 style="color:${RC[c.rar]}">${RAR[c.rar]}!</h2><div class="pop" style="max-width:190px;margin:0 auto;width:100%">${cardHTML(c)}</div><p class="hint">${TR[c.a].sk}${c.b>=0?' + '+TR[c.b].sk:''} ระดับ ${ROM[c.lv]}. ${perkText(c)}</p>${S.amber?'<button class="main" id="mAgain">ทุบอีกก้อน ('+S.amber+')</button>':''}<button id="mClose">เก็บเข้าคอลเลกชัน</button>`}
mbox.addEventListener('click',e=>{const tg=e.target;
if(tg.closest('#amber')){hits++;if(hits>=5){reveal();return}crackView();$('#amber').classList.add('knock');return}
if(tg.id==='mAgain'){openCrack();return}
if(tg.id==='mClose'){closeSheet();return}
if(tg.id==='mUp'){const k=sheet,cost=k==='rod'?rodCost():boatCost();if(S.coins<cost)return;S.coins-=cost;S[k]++;save();renderSheet();toast((k==='rod'?'เบ็ด':'เรือ')+'ระดับ '+S[k]);return}
if(tg.id==='reset'){if(!resetArm){resetArm=true;tg.textContent='แตะอีกครั้งเพื่อยืนยัน';setTimeout(()=>{resetArm=false;if(tg.isConnected)tg.textContent='ล้างเซฟ'},3000);return}
try{localStorage.removeItem('nekofish1')}catch(err){}S={coins:0,rod:1,boat:1,amber:1,cards:[],crew:[],best:1,t:Date.now()};resetArm=false;closeSheet();setMode('port');return}
const el=tg.closest('.card');if(el&&sheet==='cards'){const c=S.cards.find(x=>x.id===el.dataset.id);if(!c||c.ret)return;
const i=S.crew.indexOf(c.id);if(i>=0)S.crew.splice(i,1);else if(crewCards().length<S.boat)S.crew.push(c.id);else{toast('เรือเต็มแล้ว อัปเกรดเรือเพื่อเพิ่มที่นั่ง');return}
save();renderSheet()}});
modal.addEventListener('click',e=>{if(e.target===modal&&sheet!=='amber')closeSheet()});
fit();setMode('port');toast(awayMsg||(S.cards.length?'แตะของบนท่าเรือ หรือแตะเรือเพื่อออกทะเล':'แตะลังอำพันบนท่าเรือเพื่อรับแมวตัวแรก'),3500);save();requestAnimationFrame(loop);
}
