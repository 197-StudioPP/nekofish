<style>
/* VOICE: cosy and playful, with a little danger out at sea
IDEA: a fisherman's tackle box with a collector's card binder
PICTURE: the live sea scene itself: boat, cat captain, line, bobber, monsters
COLOUR and TYPE: sea teal and sand, one amber accent; Mitr headings, Sarabun body
LAYOUT: scene on top, big thumb buttons under it, port and card binder below */
:root{color-scheme:light dark;--bg:light-dark(#f5ecdc,#0e1b22);--ink:light-dark(#1d2a30,#efe6d6);--mut:light-dark(#6b6457,#a59c8c);--card:light-dark(#fffaf0,#16262e);--line:light-dark(#e2d5bd,#2a3a42);--sea:#296778;--amb:#ffc47b;--amb2:#ab6940}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Sarabun,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,button{font-family:Mitr,Sarabun,sans-serif;font-weight:500}
.wrap{max-width:760px;margin:0 auto;padding:12px max(3vw,12px) 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;margin:4px 2px 10px}
h1{font-size:32px;line-height:1.05;margin:0}
.stats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:15px;color:var(--mut)}
.stats b{color:var(--ink);font-family:Mitr;font-weight:500;white-space:nowrap}
.fig{position:fixed;inset:0;overflow:hidden;background:var(--sea);touch-action:none;user-select:none;-webkit-user-select:none}
.fig canvas{position:absolute;inset:0;width:100%;height:100%}
#toast{position:fixed;z-index:20;left:50%;top:52px;font-family:Mitr,Sarabun,sans-serif;transform:translateX(-50%);background:rgba(8,18,24,.85);color:#fff;padding:10px 18px;border-radius:14px;font-size:17px;width:max-content;max-width:90%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
.status{display:flex;gap:4px 14px;flex-wrap:wrap;margin:10px 2px;font-size:15px;color:var(--mut);min-height:24px}
.status b{color:var(--ink);font-weight:600;white-space:nowrap}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
button{min-height:48px;border:0;border-radius:14px;font-size:17px;cursor:pointer;color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:6px 12px}
button.main{background:var(--amb);color:#2a1606;box-shadow:0 3px 0 var(--amb2);font-size:20px;min-height:64px}
button.main:active{transform:translateY(2px);box-shadow:0 1px 0 var(--amb2)}
button.alt{background:#5fb3c9;box-shadow:0 3px 0 #2f7f94}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.big{grid-column:1/-1}
section{margin-top:24px}
h2{font-size:22px;line-height:1.2;margin:0 0 10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.box{background:var(--card);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column}
.box h3{margin:0;font-size:18px}.box p{margin:4px 0 12px;color:var(--mut);font-size:15px;flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.card{border-radius:14px;padding:12px 8px 10px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;position:relative;text-align:center}
.card.r1{box-shadow:inset 0 0 0 2px #3d95d4}
.card.r2{box-shadow:inset 0 0 0 3px #a55ad0;background:light-dark(#f7efff,#231b30)}
.card.r3{background:conic-gradient(from 30deg,#fff4d6,#b9c6d8,#f2dfbd,#8c8c9c,#d9a070,#fff4d6);box-shadow:inset 0 0 0 3px #d9a514;color:#1d2a30}
.card.crew::after{content:"บนเรือ";position:absolute;top:8px;left:8px;background:var(--amb);color:#2a1606;font:500 13px Mitr;padding:1px 8px;border-radius:8px}
.card.cap::after{content:"บนเรือ"}
.card.ret{filter:grayscale(1);opacity:.55;cursor:default}
.card svg{width:84px;height:84px;display:block;margin:0 auto}
.card .nm{font:500 17px/1.3 Mitr;margin-top:2px}
.card .tb{font-size:13px;opacity:.85}
.rar{font-size:13px;font-weight:600}
.paws{display:flex;justify-content:center;gap:3px;margin-top:6px}
.paws i{width:9px;height:9px;border-radius:50%;background:var(--amb)}
.paws i.x{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mut)}
.sts{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:center;margin:6px 4px 0;font-size:13px;text-align:left}.sts b{height:6px;border-radius:3px;background:#0001;overflow:hidden}.sts i{display:block;height:100%;background:var(--amb)}.ttl{font:500 13px Mitr;color:#b8640f}.stars{color:#e8b52c;font-size:15px;letter-spacing:1px}.stars span{opacity:.25}.pers{font-size:12.5px;opacity:.75;margin:2px 4px}.fav{font-size:12.5px;margin-top:2px}.skd{font-size:12px;line-height:1.45;margin:2px 4px;opacity:.85}.card.locked{cursor:default;opacity:.85}.card.spc{box-shadow:inset 0 0 0 3px #3d95d4;background:light-dark(#eef6ff,#18263a)}.card.leg{box-shadow:inset 0 0 0 3px #d9a514;background:linear-gradient(160deg,#fff6d8,#ffe4a0)}.rtag{font:600 11px Mitr;color:#fff;background:#3d95d4;padding:1px 6px;border-radius:7px}.leg .rtag{background:#d9a514}.prog{height:8px;border-radius:4px;background:#0001;overflow:hidden;margin:6px 6px 0}.prog i{display:block;height:100%;background:var(--amb)}.card.locked .nm{opacity:.5}
.skl{margin-top:5px;font:500 13px Mitr;color:#2f86c9}.bond{font-size:13px;color:#d6304e;margin-top:3px}.bond .hun,.bond .full{font:600 12px Mitr;padding:1px 7px;border-radius:8px;color:#fff;background:#d6304e}.bond .full{background:#3aa35a}.feed{margin-top:6px;min-height:36px;font-size:14px;width:100%;background:var(--amb);color:#2a1606;box-shadow:none}
.hint{color:var(--mut);font-size:14px;margin:8px 2px}
.perks{display:grid;gap:6px;font-size:15px}
.perks b{font-family:Mitr;font-weight:500}
#modal{position:fixed;inset:0;background:#172e3eb8;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:10;padding:clamp(10px,3vw,24px)}
#modal.on{display:flex}
.mbox{background:linear-gradient(155deg,var(--card),var(--bg));border:1px solid var(--line);border-radius:24px;padding:clamp(12px,4vw,22px);max-width:490px;max-height:calc(100dvh - 32px);overflow:auto;width:100%;text-align:center;display:grid;gap:9px;box-shadow:0 18px 56px #10263865;overscroll-behavior:contain}
.mbox button{min-height:44px}
.mbox button.main{min-height:52px}
.mbox .hint{margin:2px 0}
.mbox h2{margin:0}
#amber{width:210px;height:210px;margin:0 auto;cursor:pointer;touch-action:manipulation}
.knock{animation:knock .18s}
@keyframes knock{50%{transform:scale(.93) rotate(3deg)}}
.pop{animation:pop .55s ease-out}
@keyframes pop{0%{transform:translateY(9px) scale(.86);opacity:0} 65%{transform:translateY(-2px) scale(1.03)}100%{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.pop,.knock{animation:none}}
.hidden{display:none!important}
.foot{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.foot button{font-size:14px;min-height:44px}
.game-version{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));z-index:2;pointer-events:none;padding:3px 8px;border-radius:12px;background:#142b38e6;color:#fff;font:12px/1.4 Sarabun,system-ui,sans-serif}
body{overflow:hidden;overscroll-behavior:none}
#voyageCatch{position:fixed;z-index:3;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:4px 11px;color:#fff7e7;background:#24434ed9;border-radius:999px;font:500 12px Mitr,sans-serif;white-space:nowrap;pointer-events:none}
#voyageCatch[hidden]{display:none}
#voyageCatch b{color:#ffdc9a}
.game-version{top:max(7px,env(safe-area-inset-top));bottom:auto}
.inventory-tabs,.inventory-pages{display:flex;justify-content:center;align-items:center;gap:6px}
.inventory-tabs button,.inventory-pages button{min-height:40px;padding:3px 8px;font-size:13px;flex:1}
.inventory-tabs button[aria-pressed=true]{background:#ffe2a8;color:#493424}
.inventory-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.inventory-slot{background:var(--card);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;align-content:center;min-height:80px;font-size:13px;padding:3px;line-height:1.3}
.inventory-slot svg{width:min(100%,56px);height:31px}
.inventory-slot.empty{opacity:.45;border-style:dashed}
@media(max-height:520px){.mbox:has(.inventory-tabs){padding:10px;gap:5px}.inventory-slot{min-height:65px}.inventory-slot svg{height:22px}}
body[data-mode=reel] .game-version{display:none}
.inventory-layout{display:grid;grid-template-columns:1fr;gap:8px}
.inventory-preview{display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 8px;border-radius:14px;background:linear-gradient(145deg,#daf1e5,#a6d8d2);color:#244753;font-size:13px}
.inventory-preview svg{width:54px;height:30px}
.inventory-slot[aria-pressed=true]{border-color:#b47a42;box-shadow:inset 0 0 0 2px #f4bf74}
@media(min-width:640px){
 .inventory-layout{grid-template-columns:1fr 2fr}
 .inventory-preview{display:grid;align-content:center;justify-items:center}
 .inventory-preview svg{width:70px;height:45px}
}
.mbox:has(.tank){max-width:690px}
.tank{height:clamp(120px,42dvh,330px);position:relative;isolation:isolate;overflow:hidden;border-radius:19px;border:1px solid #c1e7d6;background:radial-gradient(ellipse at 16% 0,#c0f3d866,transparent 51%),linear-gradient(#9bd8cb,#438e99 73%,#397b8d);color:#183c48;box-shadow:inset 0 0 28px #21617370}
.tank::before{content:"";position:absolute;inset:80% -8px -6px;z-index:-1;background:radial-gradient(ellipse at 48% 85%,#eed5a0,#b19f72);border-radius:54% 61% 0 0}
.tank-fish{position:absolute;left:var(--left);top:var(--top);animation:tank-drift 3.8s ease-in-out infinite alternate;animation-delay:var(--delay)}
.tank-fish svg{width:clamp(45px,12vw,74px);height:40px}
.tank-fed .tank-fish{animation-duration:.6s}
.tank-tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tank-tools button,.tank-tools select{min-height:40px;padding:4px 8px;border-radius:11px;font-size:13px}
@keyframes tank-drift{to{transform:translate(17px,-6px)}}

#trainingHUD[hidden],body:has(#modal.on) #trainingHUD{display:none}
.quest-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}

.quest-main{--quest-tint:#d4efe6;--quest-accent:#4f9c91}
.quest-side{--quest-tint:#ffe7be;--quest-accent:#c7934c}
.quest-daily{--quest-tint:#e7e2f6;--quest-accent:#8b78b3}
.quest-detail{text-align:left;display:grid;gap:7px;padding:11px;border-radius:15px;border:1px solid var(--line);background:var(--card)}
.quest-detail h3,.quest-detail p{margin:0}
.quest-type{justify-self:start;border-radius:999px;padding:2px 9px;background:var(--quest-tint);color:#284049;font-size:12px}
.quest-progress{display:flex;align-items:center;gap:8px;font:500 13px Mitr,sans-serif}
.quest-progress progress{flex:1;height:10px;accent-color:var(--quest-accent)}
.quest-reward{display:flex;gap:6px;align-items:center;font-size:14px}
.quest-coin{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#ffd285;color:#745030;font-weight:700}
.quest-detail button.quest-claim{background:#ffc47b;color:#442c22;font-weight:600}
.quest-detail details summary{cursor:pointer;font-size:13px}
#questQuick{position:fixed;z-index:3;top:max(46px,calc(env(safe-area-inset-top) + 39px));right:max(8px,env(safe-area-inset-right));width:min(205px,43vw);padding:5px;background:linear-gradient(145deg,#204255f2,#182f45e8);border:1px solid #9dccbe55;border-radius:13px;box-shadow:0 3px 10px #0a24383d;color:#fff3d3;animation:quest-slide .24s ease-out}

.quest-row .quest-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.quest-row .quest-count{font-variant-numeric:tabular-nums}
.quest-row .quest-goal,.quest-row .quest-gold{font:400 clamp(11px,2.6vw,13px)/1.25 Sarabun,sans-serif}
.quest-row .quest-gold{white-space:nowrap;color:#ffe2a5}

#questQuick:has(.quest-toggle[aria-expanded=false]){width:108px}
@keyframes quest-slide{from{opacity:0;transform:translateX(10px)}}
@media(prefers-reduced-motion:reduce){#questQuick{animation:none}}

  const index=Number($('#tankChoice')?.value);
  if(S.box[index]){S.tank.push(...S.box.splice(index,1));save();renderSheet()}
 }else if(tg.id==='tankReturn'&&S.tank.length&&S.box.length<BOXCAP){
  S.box.push(S.tank.pop());save();renderSheet();
 }else if(tg.id==='tankPlay'||tg.id==='tankFeed'){
  if(tg.id==='tankFeed'){
   if(!S.box.length)return;
   const fish=S.box.reduce((lowest,f)=>f.cm<lowest.cm?f:lowest);
   S.box.splice(S.box.indexOf(fish),1);save();renderSheet();
  }
  const view=$('#tankView');
  view.classList.add('tank-fed');
  setTimeout(()=>view.classList.remove('tank-fed'),1900);
 }else if(tg.id==='collectionPrize'){
  claimCollectionReward();

 }
 return;
}
const mk=tg.closest('[data-mark]');if(mk&&sheet==='shop'){const f=S.box.find(x=>x.id===mk.dataset.mark);if(f){f.sell=!f.sell;save();renderSheet()}return}
if(['markLow','markAll','markNone'].includes(tg.id)&&sheet==='shop'){for(const f of S.box)f.sell=tg.id==='markAll'?true:tg.id==='markNone'?false:f.g<=1;save();renderSheet();return}
if(tg.id==='gotoShop'){openSheet('shop');return}
if(tg.id==='shopSell'&&sheet==='shop'){const sel=S.box.filter(f=>f.sell),v=sel.reduce((a,f)=>a+priceOf(f),0);if(!sel.length)return;S.box=S.box.filter(f=>!f.sell);S.coins+=v;S.stat=S.stat||{};S.stat.sold=(S.stat.sold||0)+v;save();{const u=checkUnlocks();if(u){showUnlock(u);return}}toast('ขาย '+sel.length+' ตัว +'+v+' เหรียญ (มี '+S.coins+')',1800);renderSheet();return}
if(tg.id==='mUp'){const k=sheet,cost=k==='rod'?rodCost():boatCost();if(S.coins<cost)return;S.coins-=cost;S[k]++;save();renderSheet();toast((k==='rod'?'เบ็ด':'เรือ')+'ระดับ '+S[k]);return}
if(tg.id==='reset'){if(!resetArm){resetArm=true;tg.textContent='แตะอีกครั้งเพื่อยืนยัน';setTimeout(()=>{resetArm=false;if(tg.isConnected)tg.textContent='ล้างเซฟ'},3000);return}
try{localStorage.removeItem('nekofish1')}catch(err){}S={coins:0,rod:1,boat:1,amber:1,cards:[],crew:[],best:1,t:Date.now(),box:[],book:{}};S.fishingTraining={step:0,claimed:false};resetArm=false;closeSheet();setMode('port');return}
if(sheet==='voyage-feed'){
 const tab=tg.closest('[data-inventory-tab]'),page=tg.closest('[data-inventory-page]');
 const inspect=tg.closest('[data-inspect-fish]');
 if(inspect){
  inventorySelection=(inventoryTab==='catch'?T.fish:S.box)[Number(inspect.dataset.inspectFish)];
  renderSheet();return;
 }
 if(tab){inventoryTab=tab.dataset.inventoryTab;inventoryPage=0;renderSheet();return}
 if(page){inventoryPage+=Number(page.dataset.inventoryPage);renderSheet();return}
}
const upgrade=tg.closest('[data-upgrade-role]');
if(upgrade&&sheet==='boat'){
 const role=upgrade.dataset.upgradeRole;
 if(!Object.hasOwn(boatRoles,role)||boatLevel(role)>=2||S.coins<roleCost(role))return;
 S.coins-=roleCost(role);
 S.fleet??={};S.fleet[role]=boatLevel(role)+1;
 save();renderSheet();return;
}
const feedSlot=tg.closest('[data-feed-slot]');
if(feedSlot&&sheet==='voyage-feed'){
 const cat=crewCards().find(c=>c.id===feedCatId&&c.hungry);
 const stock=inventoryTab==='catch'?T.fish:S.box;
 const index=Number(feedSlot.dataset.feedSlot),fish=stock[index];
 if(!cat||!fish)return;
 stock.splice(index,1);
 if(inventoryTab==='catch')S.book[fish.n]=Math.max(S.book[fish.n]||0,fish.cm);
 feedCat(cat,fish);
 feedCatId=null;closeSheet();return;
}
function feedCat(cat,fish){
 const favorite=fish.n===CH[cat.a].fav;
 cat.hungry=false;
 cat.bxp=(cat.bxp||0)+(1+fish.g)*(favorite?2:1);
 const bond=Math.min(5,Math.floor(cat.bxp/4)),increased=bond>(cat.bond||0);
 cat.bond=bond;
 toast(CH[cat.a].n+' กิน'+fish.n+(favorite?' ของชอบ! ♥♥':increased?' ความผูกพันเพิ่มขึ้น ♥':' อิ่มแล้ว'),1600);
 save();updateVoyageHud();refreshQuestQuick();
}
const fd=tg.closest('[data-feed]');
if(fd&&sheet==='cards'){
 const cat=S.cards.find(x=>x.id===fd.dataset.feed);
 if(!cat||cat.ret||(!cat.hungry&&(cat.bond||0)>=5))return;
 const ordered=[...S.box].sort((a,b)=>a.v-b.v);
 const fish=ordered.find(f=>f.n===CH[cat.a].fav)||ordered[0];
 if(!fish)return;
 S.box=S.box.filter(x=>x!==fish);
 feedCat(cat,fish);renderSheet();return;
}
const el=tg.closest('.card');if(el&&sheet==='cards'){const c=S.cards.find(x=>x.id===el.dataset.id);if(!c||c.ret)return;
const i=S.crew.indexOf(c.id);if(i>=0)S.crew.splice(i,1);else if(crewCards().length<CREW)S.crew.push(c.id);else{toast('พาแมวขึ้นเรือได้ 3 ตัว เอาตัวอื่นลงก่อน');return}
save();renderSheet()}});
modal.addEventListener('click',e=>{if(performance.now()-openedAt<450)return;if(e.target===modal&&sheet!=='amber'&&sheet!=='result'&&sheet!=='reveal'&&sheet!=='intro')closeSheet()});
S.fishingTraining??={step:0,claimed:false};claimTrainingReward();
fit();setMode('port');if(awayMsg)toast(awayMsg,3500);save();requestAnimationFrame(loop);
}
</script></body></html>
