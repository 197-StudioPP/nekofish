.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

body{overflow:hidden;overscroll-behavior:none}

cx.fillStyle='#4a2f1b';cx.fillRect(bxo-1.5,byo-46,3,46);
cx.fillStyle='#e8912e';cx.beginPath();cx.moveTo(bxo+1.5,byo-46);cx.quadraticCurveTo(bxo+14,byo-42+Math.sin(t*5)*3,bxo+26,byo-40);cx.lineTo(bxo+1.5,byo-30);cx.fill();
cx.fillStyle='#e04a3a';cx.beginPath();cx.moveTo(bxo-12,byo+4);cx.lineTo(bxo,byo-14);cx.lineTo(bxo+3,byo+4);cx.fill();cx.fillStyle='#9a2a20';cx.beginPath();cx.moveTo(bxo+3,byo+4);cx.lineTo(bxo,byo-14);cx.lineTo(bxo+12,byo+4);cx.fill();cx.fillStyle='#00000030';cx.beginPath();cx.ellipse(bxo+3,byo+6,16,3,0,0,7);cx.fill();
hitR(bxo-30,byo-56,64,76,'far');lblS('ไปต่อ ›',bxo,byo+24);
}
function drawCargo(bx,by){const L=lead();
cx.fillStyle='#4a2f1b';cx.fillRect(bx-46,by-100,4,96);
cx.fillStyle='#f4efe6';cx.beginPath();cx.moveTo(bx-42,by-100);cx.quadraticCurveTo(bx-18,by-96+Math.sin(t*4)*3,bx+6,by-100);cx.lineTo(bx+6,by-72);cx.quadraticCurveTo(bx-18,by-68+Math.sin(t*4+1)*3,bx-42,by-72);cx.fill();
cx.fillStyle='#e8912e';cx.beginPath();cx.ellipse(bx-22,by-84,6,5,0,0,7);cx.fill();for(let i=0;i<4;i++){cx.beginPath();cx.arc(bx-28+i*4,by-91,2.2,0,7);cx.fill()}
for(let i=0;i<Math.min(T.food,6);i++)cube(bx-66+(i%3)*11,by-12-Math.floor(i/3)*10,9,8,4,i%2?'#7a5230':'#8a5a34');
const nf=Math.min(8,Math.ceil(T.hold/12));for(let i=0;i<nf;i++){cx.fillStyle='#cfe0e8';cx.beginPath();cx.ellipse(bx+34+(i%4)*8,by-6-Math.floor(i/4)*5,6,3,(i%2?.3:-.3),0,7);cx.fill()}
for(let i=0;i<Math.min(T.amb,4);i++){cx.fillStyle='#e8912e';cx.beginPath();cx.arc(bx+22+i*7,by-12,3.5,0,7);cx.fill()}
}
function tip(m,y){banner(m)}
let SP=[];
function spot(x,y,a,lab,hot){SP.push({x,y,r:hot?26:22,a});const p=1+Math.sin(t*4)*(hot?.2:.08);
cx.fillStyle=hot?'#e8912e55':'#ffffff3a';cx.beginPath();cx.arc(x,y,20*p,0,7);cx.fill();
cx.strokeStyle='#ffffffcc';cx.lineWidth=2;cx.beginPath();cx.arc(x,y,20*p,0,7);cx.stroke();
cx.fillStyle=hot?'#e8912e':'#fff';cx.beginPath();cx.arc(x,y,7,0,7);cx.fill();
if(lab){cx.font='500 13px Mitr,sans-serif';cx.textAlign='center';const w=cx.measureText(lab).width+16,lx=cl(x,w/2+4,W-w/2-4);cx.fillStyle='#08121ab3';rr(lx-w/2,y+26,w,22,11);cx.fillStyle='#fff';cx.fillText(lab,lx,y+42)}}
let last=performance.now();
function loop(now){try{const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;shake=Math.max(0,shake-dt);if(BUB)BUB.t-=dt;bubT-=dt;if(bubT<=0&&(mode==='port'||mode==='idle'||mode==='wait')&&PETPOS.length){const p=pick(PETPOS),c=S.cards.find(x=>x.id===p.id);if(c)say(c,c.hungry?pick(['หิวแล้ว…','ขอปลาหน่อย','ท้องร้องแล้วเนี่ย']):pick(CH[c.a].lines));bubT=7+Math.random()*7}flash=Math.max(0,flash-dt);
if(mode==='wait'){cast=Math.min(1,cast+dt*2.5);waitT-=dt;if(waitT<=0){item=roll();biteT=1.5;setMode('bite')}}
else if(mode==='bite'){biteT-=dt;if(biteT<=0){toast('ช้าไป ปลาหลุดเบ็ด');setMode('idle')}}
else if(mode==='reel'){if(!modal.classList.contains('on'))upReel(dt)}else if(mode==='land'){LAND.t+=dt;if(LAND.t>=1.7){setMode('idle');showResult(LAND.h)}}else if(mode==='fight')upFight(dt);
if(W)draw();}catch(err){console.error(err)}requestAnimationFrame(loop)}

addEventListener('pointerup',()=>{holding=false});addEventListener('pointercancel',()=>{holding=false});
fig.addEventListener('pointerdown',e=>{e.preventDefault();const b=fig.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
if(mode==='land')return;if(mode==='reel'){strike();return}if(mode==='wait'||mode==='bite'){hook();return}
let best=null;for(const p of SP)if(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h){best=p;break}
if(best)act(best.a);else if(mode==='fight')hit();else if(mode==='idle'&&y>H*.42)doCast()});
addEventListener('keydown',e=>{if(e.repeat||$('#modal').classList.contains('on'))return;
if(e.code==='Space'){e.preventDefault();({port:sail,idle:doCast,wait:hook,bite:hook,reel:strike,fight:dodge})[mode]?.()}
else if(e.key==='j'&&mode==='fight')hit()});
addEventListener('keyup',e=>{if(e.code==='Space')holding=false});

let hits=0,resetArm=false;
const CR=['M100 34 L90 72 L108 96','M54 92 L86 104 L76 136','M150 76 L120 108 L134 146','M66 150 L98 124 L122 164','M100 100 L58 118 M100 100 L154 116'];
function crackView(){mbox.innerHTML=`<h2>ทุบอำพัน</h2><p class="hint">แตะอีก ${5-hits} ครั้ง</p><svg id="amber" viewBox="0 0 200 200" role="button" aria-label="แตะเพื่อทุบ"><defs><radialGradient id="ag" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd27a"/><stop offset=".6" stop-color="#e8912e"/><stop offset="1" stop-color="#9a4c0c"/></radialGradient></defs><path d="M100 18 C150 22 182 70 176 118 C170 160 136 186 98 184 C56 182 22 152 24 108 C26 62 56 16 100 18Z" fill="url(#ag)"/><g opacity="${.15+hits*.12}" fill="#3a1a04"><ellipse cx="100" cy="122" rx="40" ry="28"/><circle cx="100" cy="86" r="24"/><path d="M80 76 L78 50 L94 66Z M120 76 L122 50 L106 66Z"/></g><ellipse cx="72" cy="56" rx="22" ry="12" fill="#fff" opacity=".35" transform="rotate(-30 72 56)"/>${CR.slice(0,hits).map(d=>`<path d="${d}" stroke="#fff3d6" stroke-width="3" fill="none" stroke-linecap="round"/>`).join('')}</svg>`}
function openCrack(){openedAt=performance.now();if(!S.amber){toast('ยังไม่มีอำพัน ออกเรือไปหามาก่อน');return}sheet='amber';hits=0;crackView();modal.classList.add('on')}
function reveal(){sheet='reveal';S.amber--;const c=newCard(),dup=!!c.dup;delete c.dup;if(!dup){S.cards.push(c);if(crewCards().length<CREW)S.crew.push(c.id)}save();const ch=CH[c.a];
mbox.innerHTML=`<p class="hint" style="margin:0">${dup?'เจอเพื่อนเก่า!':'เพื่อนใหม่!'}</p><h2>${ch.n}${c.rar===3?' ร่างทอง':''}</h2><p style="margin:0;color:#b8640f;font:500 15px Mitr">${dup?'★ เพิ่มเป็น '+c.lv+' ดาว · ค่าพลังเพิ่มขึ้น':ch.ttl}</p><div class="pop" style="max-width:200px;margin:0 auto;width:100%">${cardHTML(c)}</div><p style="margin:0;font:500 16px Mitr">“${pick(ch.lines)}”</p><p class="hint">${perkText(c)}</p>${S.amber?'<button class="main" id="mAgain">ทุบอีกก้อน ('+S.amber+')</button>':''}<button id="mClose">ปิด</button>`}
mbox.addEventListener('click',e=>{if(performance.now()-openedAt<450)return;const tg=e.target;
if(tg.closest('#amber')){hits++;if(hits>=5){reveal();return}crackView();$('#amber').classList.add('knock');return}
if(tg.id==='mAgain'){openCrack();return}
if(tg.closest('#mClose')){closeSheet();return}
const mk=tg.closest('[data-mark]');if(mk&&sheet==='shop'){const f=S.box.find(x=>x.id===mk.dataset.mark);if(f){f.sell=!f.sell;save();renderSheet()}return}
if(['markLow','markAll','markNone'].includes(tg.id)&&sheet==='shop'){for(const f of S.box)f.sell=tg.id==='markAll'?true:tg.id==='markNone'?false:f.g<=1;save();renderSheet();return}
if(tg.id==='gotoShop'){openSheet('shop');return}
if(tg.id==='shopSell'&&sheet==='shop'){const sel=S.box.filter(f=>f.sell),v=sel.reduce((a,f)=>a+priceOf(f),0);if(!sel.length)return;S.box=S.box.filter(f=>!f.sell);S.coins+=v;S.stat=S.stat||{};S.stat.sold=(S.stat.sold||0)+v;save();{const u=checkUnlocks();if(u){showUnlock(u);return}}toast('ขาย '+sel.length+' ตัว +'+v+' เหรียญ (มี '+S.coins+')',1800);renderSheet();return}
if(tg.id==='mUp'){const k=sheet,cost=k==='rod'?rodCost():boatCost();if(S.coins<cost)return;S.coins-=cost;S[k]++;save();renderSheet();toast((k==='rod'?'เบ็ด':'เรือ')+'ระดับ '+S[k]);return}
if(tg.id==='reset'){if(!resetArm){resetArm=true;tg.textContent='แตะอีกครั้งเพื่อยืนยัน';setTimeout(()=>{resetArm=false;if(tg.isConnected)tg.textContent='ล้างเซฟ'},3000);return}
try{localStorage.removeItem('nekofish1')}catch(err){}S={coins:0,rod:1,boat:1,amber:1,cards:[],crew:[],best:1,t:Date.now(),box:[],book:{}};resetArm=false;closeSheet();setMode('port');return}
const fd=tg.closest('[data-feed]');if(fd&&sheet==='cards'){const c=S.cards.find(x=>x.id===fd.dataset.feed);if(c&&S.box.length){const fv=S.box.filter(x=>x.n===CH[c.a].fav).sort((a,b)=>a.v-b.v)[0],f=fv||[...S.box].sort((a,b)=>a.v-b.v)[0];S.box=S.box.filter(x=>x!==f);c.hungry=false;c.bxp=(c.bxp||0)+(1+f.g)*(fv?2:1);const nb=Math.min(5,Math.floor(c.bxp/4));const up=nb>(c.bond||0);c.bond=nb;toast(CH[c.a].n+' กิน'+f.n+(fv?' ของชอบ! ♥♥':up?' ความผูกพันเพิ่มขึ้น ♥':' อิ่มแล้ว'),1600);save();renderSheet()}return}
const el=tg.closest('.card');if(el&&sheet==='cards'){const c=S.cards.find(x=>x.id===el.dataset.id);if(!c||c.ret)return;
const i=S.crew.indexOf(c.id);if(i>=0)S.crew.splice(i,1);else if(crewCards().length<CREW)S.crew.push(c.id);else{toast('พาแมวขึ้นเรือได้ 3 ตัว เอาตัวอื่นลงก่อน');return}
save();renderSheet()}});
modal.addEventListener('click',e=>{if(performance.now()-openedAt<450)return;if(e.target===modal&&sheet!=='amber'&&sheet!=='result'&&sheet!=='reveal'&&sheet!=='intro')closeSheet()});
fit();setMode('port');if(awayMsg)toast(awayMsg,3500);save();requestAnimationFrame(loop);
}
